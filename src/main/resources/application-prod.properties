# Perfil de producción (usado por el empaquetado jpackage)

# H2 embebida en la carpeta del usuario para que funcione desde cualquier ubicación
spring.datasource.url=jdbc:h2:file:${user.home}/LimpiaMedia/data/limpiamedia;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 desactivada en producción
spring.h2.console.enabled=false

# DevTools desactivado en producción
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Thymeleaf con caché en producción
spring.thymeleaf.cache=true

# Abrir el navegador automáticamente al iniciar (lo hace el runner de la app)
