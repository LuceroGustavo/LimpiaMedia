spring.application.name=LimpiaMedia

# H2 embebida (archivo local). AUTO_SERVER permite varios procesos (necesario con DevTools)
spring.datasource.url=jdbc:h2:file:./data/limpiamedia;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 (dev) -> http://localhost:8080/h2-console
spring.h2.console.enabled=true

# DevTools: reinicio automático al modificar código (dev)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Thymeleaf: sin cache en dev para ver los cambios de plantillas al refrescar
spring.thymeleaf.cache=false
